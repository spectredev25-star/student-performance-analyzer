[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "student-performance-analyzer"
version = "0.1.0"
description = "Modular student assessment analytics"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "matplotlib>=3.8", "psycopg[binary]>=3.1"]

[project.scripts]
student-analyzer = "student_analyzer.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
